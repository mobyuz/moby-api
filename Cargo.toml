[package]
name = "moby-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Backend API for the Moby companion"
license = "GPL-3.0-only"
publish = false

[dependencies]
argon2 = "=0.5.3"
axum = "=0.8.9"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", features = ["pkcs8"] }
futures-util = { version = "=0.3.34", default-features = false }
getrandom = "=0.4.3"
hex = "=0.4.3"
hmac = "=0.12.1"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["rust_crypto"] }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
moby-protocol = { version = "=0.2.0", path = "vendor/moby-protocol" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-webpki", "uuid"] }
time = { version = "=0.3.55", features = ["serde-well-known"] }
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json"] }
url = "=2.5.8"
utoipa = { version = "=6.0.0", features = ["macros", "uuid"] }
uuid = { version = "=1.28.0", features = ["serde", "v4"] }

[dev-dependencies]
rand = "=0.8.8"
rsa = "=0.9.10"
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
